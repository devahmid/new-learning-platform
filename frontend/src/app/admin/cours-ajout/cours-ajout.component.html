   <form [formGroup]="courseForm" (ngSubmit)="submit()" class="max-w-4xl mx-auto p-6 bg-white shadow rounded space-y-6">

    <div class="space-y-2">
      <label for="title" class="font-semibold">Titre du cours</label>
      <input pInputText id="title" formControlName="title" class="w-full" />
    </div>
  
    <div class="space-y-2">
      <label for="description" class="font-semibold">Description</label>
      <textarea pInputTextarea id="description" formControlName="description" rows="4" class="w-full"></textarea>
    </div>
  
    <div class="flex gap-4">
      <div class="flex-1 space-y-2">
        <div class="flex-1 space-y-2">
          <label class="font-semibold">Lien de la vidéo</label>
          <input pInputText formControlName="videoUrl" placeholder="https://..." class="w-full" />
        </div>
        
      </div>
  
      <div class="flex-1 space-y-2">
        <label class="font-semibold">PDF du cours</label>
        <p-fileUpload
        mode="basic"
        name="files"
        customUpload="true"
        (onSelect)="uploadFile($event, courseForm.get('pdfUrl'))"
        chooseLabel="Choisir un PDF"
      ></p-fileUpload>
      
      </div>
    </div>
  
    <div class="flex gap-4">
      <div class="flex-1 space-y-2">
        <label class="font-semibold">Niveau</label>
        <p-dropdown
          [options]="[{ label: 'Débutant', value: 1 }, { label: 'Intermédiaire', value: 2 }]"
          formControlName="levelId"
          placeholder="Choisir un niveau"
          [style]="{ width: '100%' }"
          class="block"
        ></p-dropdown>
      </div>
    
      <div class="flex-1 space-y-2">
        <label class="font-semibold">Catégorie</label>
        <p-dropdown
          [options]="categories"
          formControlName="categoryId"
          placeholder="Choisir une catégorie"
          [style]="{ width: '100%' }"
          class="block"
        ></p-dropdown>
      </div>
    </div>
    
  
    <!-- Leçons -->
    <div formArrayName="lessons" class="space-y-4 mt-6">
      <h2 class="text-xl font-bold">Leçons</h2>
  
      <div *ngFor="let lesson of lessons.controls; let i = index" [formGroupName]="i" class="bg-gray-50 p-4 rounded shadow">
        <div class="space-y-2">
          <label>Titre</label>
          <input pInputText formControlName="title" class="w-full" />
        </div>
  
        <div class="space-y-2">
          <label>Contenu</label>
          <textarea pInputTextarea formControlName="content" class="w-full" rows="3"></textarea>
        </div>
  
        <div class="flex gap-4">
          <div class="flex-1 space-y-2">
            <label class="font-semibold">Lien de la vidéo</label>
            <input pInputText formControlName="videoUrl" placeholder="https://..." class="w-full" />
          </div>
          
          <p-fileUpload
            mode="basic"
            name="files"
            customUpload="true"
            (onSelect)="uploadFile($event, lesson.get('fileUrl'))"
            chooseLabel="Fichier"
          ></p-fileUpload>
        </div>
      </div>
  
      <button type="button" class="p-button p-component" (click)="addLesson()">
        <span class="p-button-label">+ Ajouter une leçon</span>
      </button>
    </div>
  
    <!-- Quizzes -->
    <div formArrayName="quizzes" class="space-y-4 mt-6">
      <h2 class="text-xl font-bold">Quiz</h2>
  
      <div *ngFor="let quiz of quizzes.controls; let i = index" [formGroupName]="i" class="bg-gray-50 p-4 rounded shadow">
        <div class="space-y-2">
          <label>Titre du quiz</label>
          <input pInputText formControlName="title" class="w-full" />
        </div>
  
        <div formArrayName="questions" class="space-y-4 mt-2">
          <h3 class="font-semibold">Questions</h3>
          <div *ngFor="let question of getQuestionsArray(quiz).controls; let j = index" [formGroupName]="j" class="space-y-2">
            <input pInputText formControlName="text" placeholder="Question" class="w-full" />
  
            <div formArrayName="answers" class="grid grid-cols-2 gap-2">
              <div *ngFor="let answer of getAnswersArray(question).controls; let k = index" [formGroupName]="k">
                <input pInputText formControlName="text" placeholder="Réponse {{k + 1}}" />
                <p-checkbox binary="true" formControlName="isCorrect" label="Correct ?"></p-checkbox>
              </div>
            </div>
            
            
            
            <button
              type="button"
              class="p-button p-button-sm p-button-outlined mt-2"
              (click)="addAnswer(question)">
              + Ajouter une réponse
            </button>
            
          </div>
  
          <button type="button" class="p-button p-button-sm p-button-outlined" (click)="addQuestion(i)">
            Ajouter une question
          </button>
        </div>
      </div>
  
      <button type="button" class="p-button p-component" (click)="addQuiz()">
        <span class="p-button-label">+ Ajouter un quiz</span>
      </button>
    </div>
  
    <button type="submit" class="mt-6 p-button p-button-success w-full">
      <span class="p-button-label">Créer le cours</span>
    </button>
  </form>
