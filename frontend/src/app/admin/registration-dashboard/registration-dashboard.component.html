<table class="min-w-full mt-6 border border-gray-300 rounded overflow-hidden">
  <thead class="bg-gray-100 text-left">
    <tr>
      <th class="px-4 py-2">Niveau</th>
      <th class="px-4 py-2">Description</th>
      <th class="px-4 py-2">Nombre d'enfants</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let stat of getChildrenStatsByLevel()">
      <td class="px-4 py-2 font-semibold text-[#2F8CCF]">Niveau {{ stat.level }}</td>
      <td class="px-4 py-2">{{ stat.label }}</td>
      <td class="px-4 py-2">{{ stat.count }}</td>
    </tr>
    <tr class="bg-gray-50 font-semibold">
      <td class="px-4 py-2 text-[#2F8CCF]" colspan="2">Total</td>
      <td class="px-4 py-2">{{ getChildrenTotalCount() }}</td>
    </tr>
  </tbody>
</table>
