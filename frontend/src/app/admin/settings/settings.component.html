<div class="max-w-4xl mx-auto p-6 mt-8">
    <h2 class="text-2xl font-bold mb-4">⚙️ Paramètres</h2>
  
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      <div
        *ngFor="let s of settings"
        class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow hover:shadow-md cursor-pointer transition-all"
        (click)="goTo(s.path)"
      >
        <div class="flex items-center gap-3 mb-2 text-emerald-600 dark:text-emerald-400">
          <i class="{{ s.icon }}"></i>
          <h3 class="text-lg font-semibold">{{ s.label }}</h3>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-300">{{ s.desc }}</p>
      </div>
    </div>
  </div>
