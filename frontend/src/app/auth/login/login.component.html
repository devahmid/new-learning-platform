<div id="login-component" class="w-full min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg">
    <div class="text-center">
      <h2 class="mt-6 text-3xl font-bold text-gray-900">Connexion / تسجيل الدخول</h2>
      <p class="mt-2 text-sm text-gray-600">Bienvenue / مرحباً بك</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div class="flex flex-col">
          <label for="email" class="mb-1 text-sm text-gray-700 font-medium">
            Email / البريد الإلكتروني
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="appearance-none rounded-lg block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 
                   focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            placeholder="example@email.com"
          />
        </div>

        <div class="flex flex-col">
          <label for="motDePasse" class="mb-1 text-sm text-gray-700 font-medium">
            Mot de passe / كلمة المرور
          </label>
          <p-password
            id="motDePasse"
            formControlName="motDePasse"
            [toggleMask]="true"
            [feedback]="false"
            [inputStyle]="{width: '100%', padding: '0.5rem 0.75rem'}"
            styleClass="appearance-none border border-gray-300 placeholder-gray-500 text-gray-900 
                        focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 rounded-lg w-full"
          ></p-password>
        </div>
      </div>

      <div class="text-right pt-2 text-sm">
        <a [routerLink]="['/forgot-password']" class="text-emerald-600 hover:underline">
          Mot de passe oublié ? / نسيت كلمة المرور ؟
        </a>        
      </div>
<div class="pt-2" *ngIf="errorMessage">
  <p class="text-sm text-red-600 text-center">{{ errorMessage }}</p>
</div>

      <div class="pt-4">
        <p-button
          label="Se connecter / تسجيل الدخول"
          icon="pi pi-sign-in"
          type="submit"
          styleClass="w-full justify-center bg-green-600 hover:bg-green-700 border-none text-white font-medium text-sm 
                      rounded-md py-2 px-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
        ></p-button>
      </div>
    </form>

    <!-- Lien vers l'inscription -->
    <div class="pt-4 text-center">
      <p class="text-sm text-gray-600">
        Pas encore de compte ? 
        <a [routerLink]="['/register']" class="text-green-600 hover:text-green-700 font-medium">
          Créer un compte / إنشاء حساب
        </a>
      </p>
    </div>
  </div>
</div>
