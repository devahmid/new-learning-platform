<div *ngFor="let msg of messages">
  <span [ngClass]="{ 'me': msg.senderId === senderId }">{{ msg.content }}</span>
  <button (click)="delete(msg.id)">❌</button>
</div>

<input [(ngModel)]="newMsg" placeholder="Écris ton message" />
<button (click)="send()">Envoyer</button>
