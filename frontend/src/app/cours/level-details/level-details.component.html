<main class="pt-20 bg-gray-50 min-h-screen">
    <section class="container mx-auto py-12 px-4">
      <div class="max-w-3xl mx-auto">
        
        <div class="flex items-center justify-between mb-8">
          <button (click)="goBack()" class="flex items-center gap-2 text-gray-600 hover:text-green-700">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Retour</span>
          </button>
          <div class="text-green-600 text-sm font-bold rounded-full border-4 border-green-400 w-12 h-12 flex items-center justify-center">
            {{ progress }}%
          </div>
        </div>
  
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-graduation-cap text-green-600 text-2xl"></i>
              <span class="text-xl font-bold text-gray-800">Niveau {{ level }}</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="h-2 w-24 bg-gray-200 rounded-full">
                <div class="h-2 rounded-full bg-green-500" [style.width.%]="progress"></div>
              </div>
              <span class="text-sm text-gray-600">{{ progress }}%</span>
            </div>
          </div>
        </div>
  
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition-shadow">
            <div class="flex items-center gap-4 mb-6">
              <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
                <i class="fa-solid fa-book text-green-600 text-xl"></i>
              </div>
              <h3 class="text-xl font-bold text-gray-800">Vocabulaire</h3>
            </div>
            <div class="space-y-4">
              <button class="w-full py-3 px-4 rounded-xl bg-green-50 hover:bg-green-100 flex items-center justify-between">
                <span class="text-gray-700">Leçon 1</span>
                <i class="fa-solid fa-check text-green-600"></i>
              </button>
              <button class="w-full py-3 px-4 rounded-xl bg-green-50 hover:bg-green-100 flex items-center justify-between">
                <span class="text-gray-700">Leçon 2</span>
                <i class="fa-solid fa-lock text-gray-400"></i>
              </button>
              <button class="w-full py-3 px-4 rounded-xl bg-green-50 hover:bg-green-100 flex items-center justify-between">
                <span class="text-gray-700">Leçon 3</span>
                <i class="fa-solid fa-lock text-gray-400"></i>
              </button>
            </div>
          </div>
  
          <div class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition-shadow">
            <div class="flex items-center gap-4 mb-6">
              <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
                <i class="fa-solid fa-pencil text-blue-600 text-xl"></i>
              </div>
              <h3 class="text-xl font-bold text-gray-800">Grammaire</h3>
            </div>
            <div class="space-y-4">
              <button class="w-full py-3 px-4 rounded-xl bg-blue-50 hover:bg-blue-100 flex items-center justify-between">
                <span class="text-gray-700">Les lettres</span>
                <i class="fa-solid fa-check text-blue-600"></i>
              </button>
              <button class="w-full py-3 px-4 rounded-xl bg-blue-50 hover:bg-blue-100 flex items-center justify-between">
                <span class="text-gray-700">Les voyelles</span>
                <i class="fa-regular fa-circle-play text-blue-600"></i>
              </button>
              <button class="w-full py-3 px-4 rounded-xl bg-blue-50 hover:bg-blue-100 flex items-center justify-between">
                <span class="text-gray-700">Les mots</span>
                <i class="fa-solid fa-lock text-gray-400"></i>
              </button>
            </div>
          </div>
        </div>
  
        <div class="mt-8">
          <button class="w-full py-4 rounded-full bg-gradient-to-r from-green-500 to-blue-500 text-white text-lg font-bold shadow-lg hover:from-green-600 hover:to-blue-600 flex items-center justify-center gap-2">
            <i class="fa-solid fa-dumbbell"></i>
            Exercices pratiques
          </button>
        </div>
      </div>
    </section>
  </main>
