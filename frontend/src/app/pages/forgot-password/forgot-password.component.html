<div class="max-w-md mx-auto mt-10">
    <div class="bg-white p-8 rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">🔐 Réinitialisation du mot de passe</h2>
      
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-700">
            Adresse email
          </label>
          <input 
            pInputText 
            formControlName="email" 
            type="email" 
            id="email"
            placeholder="Votre adresse email" 
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched"
          />
          <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500 text-sm">
            <span *ngIf="form.get('email')?.errors?.['required']">L'email est requis</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Format d'email invalide</span>
          </div>
        </div>
        
        <button 
          pButton 
          type="submit" 
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors"
          [disabled]="form.invalid || isLoading"
        >
          <span *ngIf="!isLoading">Envoyer le lien de réinitialisation</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <i class="fas fa-spinner fa-spin mr-2"></i>
            Envoi en cours...
          </span>
        </button>
      </form>
      
      <!-- Message de succès -->
      <div *ngIf="success" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
        <div class="flex items-start">
          <i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i>
          <div>
            <h3 class="text-green-800 font-semibold">Demande envoyée</h3>
            <p class="text-green-700 text-sm mt-1">{{ successMessage }}</p>
          </div>
        </div>
      </div>
      
      <!-- Message d'erreur -->
      <div *ngIf="error" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex items-start">
          <i class="fas fa-exclamation-circle text-red-500 mt-1 mr-3"></i>
          <div>
            <h3 class="text-red-800 font-semibold">Erreur</h3>
            <p class="text-red-700 text-sm mt-1">{{ errorMessage }}</p>
          </div>
        </div>
      </div>
      
      <!-- Instructions -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Vous recevrez un email avec un lien pour réinitialiser votre mot de passe.
        </p>
        <a routerLink="/login" class="text-green-600 hover:text-green-700 text-sm font-medium mt-2 inline-block">
          ← Retour à la connexion
        </a>
      </div>
    </div>
  </div>
