
<app-spinner [loading]="loading" />

<form [formGroup]="form" class="p-6 space-y-6" (ngSubmit)="payWithStripe()">
  <h2 class="text-xl font-semibold">Effectuer un paiement</h2>

  <div class="space-y-2">
    <label class="block text-sm font-medium text-gray-700">Montant à payer (€)</label>
    <input
      type="number"
      formControlName="amount"
      min="1"
      step="0.01"
      class="border border-gray-300 rounded-md px-3 py-2 w-full max-w-xs"
      placeholder="Ex: 12.50"
    />
    <small *ngIf="form.get('amount')?.invalid && form.get('amount')?.touched" class="text-red-500">
      Montant minimum : 1€
    </small>
  </div>

  <div class="flex flex-col sm:flex-row gap-4">
    <button
      type="submit"
      class="bg-blue-600 text-white px-4 py-2 rounded w-full sm:w-auto disabled:opacity-50"
      [disabled]="!isAmountValid"
    >
      Payer par carte
    </button>

    <button
      type="button"
      class="bg-yellow-500 text-white px-4 py-2 rounded w-full sm:w-auto disabled:opacity-50"
      [disabled]="!isAmountValid"
      (click)="payWithPayPal()"
    >
      Payer avec PayPal
    </button>
  </div>

  <div id="paypal-button-container" *ngIf="paypalVisible()"></div>
</form>
