<div *ngIf="popup.isVisible()" [ngClass]="{
  'bg-red-100 text-red-800': popup.type() === 'error',
  'bg-blue-100 text-blue-800': popup.type() === 'info',
  'bg-green-100 text-green-800': popup.type() === 'success'
}" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white text-gray-800 rounded-lg shadow-lg px-6 py-4 w-full max-w-md text-center">
        <h3 class="text-lg font-semibold mb-2">Attention</h3>
        <p>{{ popup.message() }}</p>
        <button (click)="popup.clear()" class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">
            Fermer
        </button>
    </div>
</div>
