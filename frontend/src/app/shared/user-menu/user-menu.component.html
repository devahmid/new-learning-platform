<div class="relative" (clickOutside)="close()">
  <div class="cursor-pointer" (click)="toggleMenu()">
    <app-user-badge [fullName]="fullName"></app-user-badge>
  </div>

  <!-- <div *ngIf="visible()" class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
    <button (click)="goToAccount(); close()" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-100 flex items-center gap-2">
      <i class="pi pi-user"></i> Mon compte
    </button>
    <button (click)="logout()" class="w-full px-4 py-2 text-left text-sm hover:bg-gray-100 flex items-center gap-2 text-red-600">
      <i class="pi pi-sign-out"></i> Déconnexion
    </button>
  </div> -->

  <div *ngIf="visible()"
    class="absolute right-0 mt-3 w-64 bg-white border border-emerald-200 rounded-2xl shadow-lg z-50 overflow-hidden">

    <!-- Header du dropdown -->
    <div class="px-4 py-2 bg-emerald-50 border-b border-emerald-100">
      <p class="text-xs font-medium text-emerald-600">Menu utilisateur</p>
    </div>

    <!-- Options du menu -->
    <div class="py-3 px-2">
      <!-- Indicateur de statut de validation -->
      <div *ngIf="validationService.isPending()" 
           class="px-3 py-2 text-xs font-medium text-yellow-700 bg-yellow-100 rounded-lg flex items-center gap-2 mb-3">
        <i class="fa-solid fa-clock animate-pulse"></i>
        En attente de validation
      </div>
      
      <button (click)="goToAccount(); close()"
        [class]="validationService.isMenuItemDisabled('mon-compte') ? 
          'w-full px-4 py-4 text-left text-sm text-gray-400 cursor-not-allowed opacity-50 flex items-center gap-4 rounded-xl border border-transparent' :
          'w-full px-4 py-4 text-left text-sm text-gray-700 hover:bg-gradient-to-r hover:from-emerald-50 hover:to-emerald-100 flex items-center gap-4 transition-all duration-300 group rounded-xl hover:shadow-md hover:scale-[1.02] border border-transparent hover:border-emerald-200'"
        [disabled]="validationService.isMenuItemDisabled('mon-compte')">
        <div
          [class]="validationService.isMenuItemDisabled('mon-compte') ? 
            'w-10 h-10 rounded-xl bg-gray-400 flex items-center justify-center shadow-lg' :
            'w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center group-hover:from-emerald-600 group-hover:to-emerald-700 transition-all duration-300 shadow-lg group-hover:shadow-xl'">
          <i class="fa-solid fa-user text-white text-sm"></i>
        </div>
        <div class="flex flex-col">
          <span [class]="validationService.isMenuItemDisabled('mon-compte') ? 
            'font-semibold text-gray-400' :
            'font-semibold text-gray-800 group-hover:text-emerald-800 transition-colors duration-300'">Mon
            compte</span>
          <span [class]="validationService.isMenuItemDisabled('mon-compte') ? 
            'text-xs text-gray-400' :
            'text-xs text-gray-500 group-hover:text-emerald-600'">Gérer mes informations</span>
        </div>
        <i *ngIf="!validationService.isMenuItemDisabled('mon-compte')"
          class="fa-solid fa-chevron-right text-emerald-400 ml-auto opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-1"></i>
        <i *ngIf="validationService.isMenuItemDisabled('mon-compte')" 
           class="fa-solid fa-lock text-gray-400 ml-auto" 
           title="Disponible après validation"></i>
      </button>

      <!-- Lien vers la progression (pour les parents) -->
      <button (click)="goToProgress(); close()"
        [class]="validationService.isMenuItemDisabled('progression') ? 
          'w-full px-4 py-4 text-left text-sm text-gray-400 cursor-not-allowed opacity-50 flex items-center gap-4 rounded-xl border border-transparent' :
          'w-full px-4 py-4 text-left text-sm text-gray-700 hover:bg-gradient-to-r hover:from-blue-50 hover:to-blue-100 flex items-center gap-4 transition-all duration-300 group rounded-xl hover:shadow-md hover:scale-[1.02] border border-transparent hover:border-blue-200'"
        [disabled]="validationService.isMenuItemDisabled('progression')">
        <div
          [class]="validationService.isMenuItemDisabled('progression') ? 
            'w-10 h-10 rounded-xl bg-gray-400 flex items-center justify-center shadow-lg' :
            'w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center group-hover:from-blue-600 group-hover:to-blue-700 transition-all duration-300 shadow-lg group-hover:shadow-xl'">
          <i class="fa-solid fa-chart-line text-white text-sm"></i>
        </div>
        <div class="flex flex-col">
          <span [class]="validationService.isMenuItemDisabled('progression') ? 
            'font-semibold text-gray-400' :
            'font-semibold text-gray-800 group-hover:text-blue-800 transition-colors duration-300'">Progression</span>
          <span [class]="validationService.isMenuItemDisabled('progression') ? 
            'text-xs text-gray-400' :
            'text-xs text-gray-500 group-hover:text-blue-600'">Suivi des enfants</span>
        </div>
        <i *ngIf="!validationService.isMenuItemDisabled('progression')"
          class="fa-solid fa-chevron-right text-blue-400 ml-auto opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-1"></i>
        <i *ngIf="validationService.isMenuItemDisabled('progression')" 
           class="fa-solid fa-lock text-gray-400 ml-auto" 
           title="Disponible après validation"></i>
      </button>

      <!-- Lien vers la messagerie -->
      <button (click)="goToMessaging(); close()"
        [class]="validationService.isMenuItemDisabled('messagerie') ? 
          'w-full px-4 py-4 text-left text-sm text-gray-400 cursor-not-allowed opacity-50 flex items-center gap-4 rounded-xl border border-transparent' :
          'w-full px-4 py-4 text-left text-sm text-gray-700 hover:bg-gradient-to-r hover:from-purple-50 hover:to-purple-100 flex items-center gap-4 transition-all duration-300 group rounded-xl hover:shadow-md hover:scale-[1.02] border border-transparent hover:border-purple-200'"
        [disabled]="validationService.isMenuItemDisabled('messagerie')">
        <div
          [class]="validationService.isMenuItemDisabled('messagerie') ? 
            'w-10 h-10 rounded-xl bg-gray-400 flex items-center justify-center shadow-lg' :
            'w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-purple-600 flex items-center justify-center group-hover:from-purple-600 group-hover:to-purple-700 transition-all duration-300 shadow-lg group-hover:shadow-xl'">
          <i class="fa-solid fa-envelope text-white text-sm"></i>
        </div>
        <div class="flex flex-col">
          <span [class]="validationService.isMenuItemDisabled('messagerie') ? 
            'font-semibold text-gray-400' :
            'font-semibold text-gray-800 group-hover:text-purple-800 transition-colors duration-300'">Messagerie</span>
          <span [class]="validationService.isMenuItemDisabled('messagerie') ? 
            'text-xs text-gray-400' :
            'text-xs text-gray-500 group-hover:text-purple-600'">Messages & notifications</span>
        </div>
        <i *ngIf="!validationService.isMenuItemDisabled('messagerie')"
          class="fa-solid fa-chevron-right text-purple-400 ml-auto opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-1"></i>
        <i *ngIf="validationService.isMenuItemDisabled('messagerie')" 
           class="fa-solid fa-lock text-gray-400 ml-auto" 
           title="Disponible après validation"></i>
      </button>

      <!-- Lien vers les cours en ligne (Zoom) -->
      <button (click)="goToZoom(); close()"
        [class]="validationService.isMenuItemDisabled('mon-compte') ? 
          'w-full px-4 py-4 text-left text-sm text-gray-400 cursor-not-allowed opacity-50 flex items-center gap-4 rounded-xl border border-transparent' :
          'w-full px-4 py-4 text-left text-sm text-gray-700 hover:bg-gradient-to-r hover:from-orange-50 hover:to-orange-100 flex items-center gap-4 transition-all duration-300 group rounded-xl hover:shadow-md hover:scale-[1.02] border border-transparent hover:border-orange-200'"
        [disabled]="validationService.isMenuItemDisabled('mon-compte')">
        <div
          [class]="validationService.isMenuItemDisabled('mon-compte') ? 
            'w-10 h-10 rounded-xl bg-gray-400 flex items-center justify-center shadow-lg' :
            'w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-orange-600 flex items-center justify-center group-hover:from-orange-600 group-hover:to-orange-700 transition-all duration-300 shadow-lg group-hover:shadow-xl'">
          <i class="fas fa-video text-white text-sm"></i>
        </div>
        <div class="flex flex-col">
          <span [class]="validationService.isMenuItemDisabled('mon-compte') ? 
            'font-semibold text-gray-400' :
            'font-semibold text-gray-800 group-hover:text-orange-800 transition-colors duration-300'">Cours en ligne</span>
          <span [class]="validationService.isMenuItemDisabled('mon-compte') ? 
            'text-xs text-gray-400' :
            'text-xs text-gray-500 group-hover:text-orange-600'">Rejoindre Zoom</span>
        </div>
        <i *ngIf="!validationService.isMenuItemDisabled('mon-compte')"
          class="fa-solid fa-chevron-right text-orange-400 ml-auto opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-1"></i>
        <i *ngIf="validationService.isMenuItemDisabled('mon-compte')" 
           class="fa-solid fa-lock text-gray-400 ml-auto" 
           title="Disponible après validation"></i>
      </button>

      <div class="mx-4 my-3 h-px bg-gradient-to-r from-transparent via-emerald-200 to-transparent"></div>

      <button (click)="logout()"
        class="w-full px-4 py-4 text-left text-sm text-red-600 hover:bg-gradient-to-r hover:from-red-50 hover:to-red-100 flex items-center gap-4 transition-all duration-300 group rounded-xl hover:shadow-md hover:scale-[1.02] border border-transparent hover:border-red-200">
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-red-600 flex items-center justify-center group-hover:from-red-600 group-hover:to-red-700 transition-all duration-300 shadow-lg group-hover:shadow-xl">
          <i class="fa-solid fa-right-from-bracket text-white text-sm"></i>
        </div>
        <div class="flex flex-col">
          <span
            class="font-semibold text-red-700 group-hover:text-red-800 transition-colors duration-300">Déconnexion</span>
          <span class="text-xs text-red-500 group-hover:text-red-600">Se déconnecter</span>
        </div>
        <i
          class="fa-solid fa-chevron-right text-red-400 ml-auto opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-1"></i>
      </button>
    </div>
  </div>


</div>
