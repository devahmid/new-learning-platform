
<div class="py-12 bg-gray-50 min-h-screen">
  <div class="container mx-auto py-16 px-4">
    <!-- Breadcrumb Navigation -->
    <div class="max-w-3xl mx-auto mb-6">
      <nav class="flex items-center space-x-2 text-sm text-gray-600 mb-4">
        <span class="text-green-600 font-medium">
          <i class="fa-solid fa-book mr-1"></i>Matières
        </span>
      </nav>
    </div>
    
<!-- Indicateur de l'enfant sélectionné -->
<div class="container mx-auto px-4 pt-8">
  <div class="bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200 rounded-xl p-4 mb-8">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-600 to-blue-700 rounded-full flex items-center justify-center text-white font-bold text-lg">
          {{ getChildInitials() }}
        </div>
        <div>
          <h3 class="text-lg font-semibold text-gray-800">{{ getSelectedChildName() }}</h3>
          <p class="text-sm text-gray-600">Classe {{ getClasseName() }} • Prêt à apprendre !</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
        <span class="text-sm text-green-600 font-medium">Actif</span>
      </div>
    </div>
  </div>
</div>

<section id="subjects-overview" class="container mx-auto py-8 px-4">
    <h2 class="text-4xl font-bold text-center mb-12">Page d’accueil</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-12 justify-items-center">
        <!-- Card Replay spéciale -->
        <div class="w-full max-w-sm relative group flex flex-col cursor-pointer" (click)="onReplayClick($event)">    
            <!-- Carte Replay avec style distinctif -->
            <div class="relative z-10 flex-1 flex flex-col justify-between px-2 pt-10 pb-4 rounded-2xl shadow-lg 
            transition-transform duration-300 hover:scale-105 bg-gradient-to-br from-purple-500 via-purple-600 to-indigo-600">
                <i class="fa-solid fa-video absolute -top-10 left-1/2 -translate-x-1/2 text-3xl bg-white p-4 rounded-full shadow-lg z-10 text-purple-600"></i>

                <!-- Bloc contenu avec bordure blanche -->
                <div class="rounded-xl bg-white p-1">
                    <div class="rounded-lg px-6 py-5 flex justify-between items-center text-white bg-gradient-to-r from-purple-600 to-indigo-600">
                        <span class="text-lg font-semibold">Replay</span>
                        <span class="text-xl">🎬</span>
                    </div>
                </div>

                <!-- Description Replay -->
                <div class="text-white text-sm italic text-center mt-2 transition-all duration-300
                   group-hover:opacity-100 group-hover:translate-y-1">
                    Cours enregistrés
                </div>
            </div>
        </div>

        <!-- Cards des matières normales -->
        <div *ngFor="let subject of subjects" class="w-full max-w-sm relative group flex flex-col cursor-not-allowed opacity-60">    
            
            <!-- Carte principale -->
            <div class="relative z-10 flex-1 flex flex-col justify-between px-2 pt-10 pb-4 rounded-2xl shadow-lg 
            transition-transform duration-300" [ngClass]="subject.color">
            <i *ngIf="subject.icon"
                class="fa-solid absolute -top-10 left-1/2 -translate-x-1/2 text-3xl bg-white p-4 rounded-full shadow-lg z-10"
                [ngClass]="subject.iconColor + ' ' + subject.icon">
            </i>

                <!-- Bloc contenu avec bordure blanche -->
                <div class="rounded-xl bg-white p-1">
                    <div class="rounded-lg px-6 py-5 flex justify-between items-center text-white"
                        [ngClass]="subject.innerColor">
                        <span class="text-lg font-semibold">{{ subject.name }}</span>
                        <span class="text-xl">{{ subject.ar }}</span>
                    </div>
                </div>

                <!-- Description FR si différente -->
                <div class="text-white text-sm italic text-center mt-2 transition-all duration-300
                   group-hover:opacity-100 group-hover:translate-y-1" [class.opacity-0]="subject.fr ">
                    {{ subject.fr || '' }}
                </div>

                <!-- Message "Bientôt disponible" -->
                <div class="text-white text-xs text-center mt-2 bg-black bg-opacity-30 rounded-lg px-2 py-1">
                    <i class="fa-solid fa-clock mr-1"></i>
                    Bientôt disponible
                </div>

            </div>
        </div>
    </div>
</section>

<!-- Popup simple -->
<div 
  *ngIf="showPopup" 
  class="fixed top-4 right-4 z-50 max-w-sm bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded-lg shadow-lg animate-slide-in">
  <div class="flex items-center">
    <div class="flex-shrink-0">
      <i class="fa-solid fa-info-circle text-blue-500 text-lg"></i>
    </div>
    <div class="ml-3">
      <p class="text-sm font-medium">{{ popupMessage }}</p>
    </div>
    <div class="ml-auto pl-3">
      <button 
        (click)="showPopup = false"
        class="text-gray-400 hover:text-gray-600 focus:outline-none">
        <i class="fa-solid fa-times"></i>
      </button>
    </div>
  </div>
</div>
