; Configuration PHP pour CORS
; Certains hébergeurs mutualisés utilisent .user.ini au lieu de .htaccess

; Activer l'affichage des erreurs pour le debug
display_errors = On
error_reporting = E_ALL

; Configuration de sécurité
expose_php = Off

; Taille des uploads
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
