<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Création Enfant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #059669; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <h1>Test Création d'Enfant</h1>
    
    <form id="createChildForm">
        <div class="form-group">
            <label for="parentId">ID du Parent:</label>
            <input type="number" id="parentId" value="1" required>
        </div>
        
        <div class="form-group">
            <label for="firstName">Prénom:</label>
            <input type="text" id="firstName" value="Test" required>
        </div>
        
        <div class="form-group">
            <label for="lastName">Nom:</label>
            <input type="text" id="lastName" value="Enfant" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="test.enfant@example.com">
        </div>
        
        <div class="form-group">
            <label for="dateOfBirth">Date de naissance:</label>
            <input type="date" id="dateOfBirth" value="2010-01-01">
        </div>
        
        <div class="form-group">
            <label for="level">Niveau:</label>
            <input type="text" id="level" value="CP" required>
        </div>
        
        <button type="submit">Créer l'Enfant</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('createChildForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                parentId: parseInt(document.getElementById('parentId').value),
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                level: document.getElementById('level').value
            };
            
            console.log('Données à envoyer:', formData);
            
            try {
                const response = await fetch('https://centre-culturel-olivier.fr/api/admin/users/children', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer YOUR_TOKEN_HERE' // Remplacez par un vrai token
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerHTML = 
                        `<div class="result success">✅ Succès: ${JSON.stringify(result, null, 2)}</div>`;
                } else {
                    document.getElementById('result').innerHTML = 
                        `<div class="result error">❌ Erreur ${response.status}: ${JSON.stringify(result, null, 2)}</div>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<div class="result error">❌ Erreur réseau: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
